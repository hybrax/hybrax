[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrax"
version = "0.1.0"
description = "Bioprocess Benchmarking Dataset Structure - JAX-compatible framework for standardized bioprocess data"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Mathias Gotsmy" }, { name = "Julian Libiseller-Egger" }]
keywords = [
    "bioprocess",
    "hybrid modeling",
    "jax",
    "neural ODE",
    "UDE",
    "universal differential equations",
    "data structures",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "jax>=0.4.30,<0.10.1",
    "jaxlib>=0.4.0",
    "numpy>=1.26",
    "pandas>=3.0.5,<3.1",
    "equinox>=0.13.8,<0.14",
    "scipy>=1.15.0",
    "diffrax>=0.7.2,<0.8",
    "sympy>=1.14.0,<1.15",
    "ijson>=3.5.1",
    "matplotlib==3.10.8",
    "optax>=0.2.8,<0.3",
    "optimistix>=0.1.0",
    "pydantic>=2.5.2",
]

[project.scripts]
hybrax = "hybrax.train.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=3.0.0",
    "pytest-xdist>=3.6",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "ruff>=0.15.6",
    "ipdb>=0.13.13",
    "jupyter>=1.1.1",
    "ipykernel>=7.2.0",
    "openpyxl>=3.1.5",
]
docs = [
    "sphinx>=7.2",
    "furo>=2024.1",
    "myst-nb>=1.1",
    "linkify-it-py>=2.0",
    "sphinx-autoapi>=3.1",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "jupyter-cache>=1.0",
    "ipykernel>=6.29",
]

[project.urls]
Homepage = "https://github.com/hybrax/hybrax"
Repository = "https://github.com/hybrax/hybrax"

[tool.ruff.lint]
extend-select = ["E501"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: end-to-end tests that exercise the training pipeline"]
filterwarnings = [
    "ignore:jax.core.mapped_aval is deprecated:DeprecationWarning",
    "ignore:jax.core.unmapped_aval is deprecated:DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
