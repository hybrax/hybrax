[project]
name = "bp-train"
version = "0.1.0"
description = "Bioprocess hybrid model setup and training with Jax and Diffrax"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "jax>=0.4.30,<0.10.1",
    "diffrax>=0.7.2,<0.8",
    "equinox>=0.13.8,<0.14",
    "optax>=0.2.8,<0.3",
    "matplotlib>=3.10.8",
    "pandas>=3.0.5,<3.1",
    "pydantic>=2.5.2",
    "sympy>=1.14.0,<1.15",
]

[project.scripts]
bp-train = "bp_train.cli:main"

[project.optional-dependencies]
dev = [
    "ipdb>=0.13.13",
    "pip>=26.0.1",
    "plotly>=6.6.0",
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "ruff>=0.15.7,<0.16",
    "scipy>=1.18.0,<1.19",
]

[tool.setuptools]
packages = ["bp_train", "diffrax_callbacks"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "examples",
]
markers = [
    "integration: marks tests as integration tests",
]
