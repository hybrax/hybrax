[project]
name = "bp-train"
version = "0.1.0"
description = "Bioprocess hybrid model setup and training with Jax and Diffrax"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "jax>=0.4.30,<0.10.1",
    "pydantic>=2",
]

[project.scripts]
bp-train = "bp_train.cli:main"

[project.optional-dependencies]
dev = [
    "ipdb>=0.13.13",
    "matplotlib>=3.10.8",
    "pip>=26.0.1",
    "plotly>=6.6.0",
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["bp_train", "diffrax_callbacks"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "examples",
]
markers = [
    "integration: marks tests as integration tests",
]
