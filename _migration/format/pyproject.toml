[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bpbench"
version = "0.1.0"
description = "Bioprocess Benchmarking Dataset Structure - JAX-compatible framework for standardized bioprocess data"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "BPbench Contributors"}
]
keywords = ["bioprocess", "benchmarking", "jax", "machine-learning", "data-structure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "numpy>=1.20.0",
    "pyyaml>=5.4.0",
    "h5py>=3.0.0",
    "equinox>=0.10.0",
    "interpax>=0.3.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]
plotting = [
    "matplotlib>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/Gotsmy/BPbench"
Repository = "https://github.com/Gotsmy/BPbench"
Documentation = "https://github.com/Gotsmy/BPbench/blob/main/README.md"

[tool.setuptools]
packages = ["bpbench"]

[tool.setuptools.package-data]
bpbench = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
