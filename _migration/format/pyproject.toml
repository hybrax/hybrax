[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bp-format"
version = "0.1.0"
description = "Bioprocess Benchmarking Dataset Structure - JAX-compatible framework for standardized bioprocess data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "bp-format Contributors"}
]
keywords = ["bioprocess", "benchmarking", "jax", "machine-learning", "data-structure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "numpy>=1.20.0",
    "equinox>=0.10.0",
    "scipy>=1.15.0",
    "pseudobatch>=1.0.0",
    "diffrax>=0.7.0",
    "sympy>=1.10.0",
    "ijson>=3.5.1",
    "pip>=26.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-xdist>=3.6",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "ruff>=0.15.6",
    "ipdb>=0.13.13",
    "jupyter>=1.1.1",
    "ipykernel>=7.2.0",
    "openpyxl>=3.1.5",
]
plotting = [
    "matplotlib>=3.0.0",
    "plotly>=6.6.0",
]

[project.urls]
Homepage = "https://github.com/Gotsmy/bp-format"
Repository = "https://github.com/Gotsmy/bp-format"
Documentation = "https://github.com/Gotsmy/bp-format/blob/main/README.md"

[tool.setuptools]
packages = ["bp_format"]

[tool.setuptools.package-data]
bp_format = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:jax.core.mapped_aval is deprecated:DeprecationWarning",
    "ignore:jax.core.unmapped_aval is deprecated:DeprecationWarning",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
